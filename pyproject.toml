[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-science-ai999x"
version = "1.0.3"
description = "Offline biomedical science solver: pharmacokinetics and dosing models, epidemic models, diagnostic test statistics, survival analysis, biomechanics, neuron models and medical-imaging physics (quantitative only, no clinical advice), with steps, LaTeX and honest refusals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Ibnul Jaif Farabi"}]
maintainers = [{name = "AI999X"}]
keywords = ["biomedical science", "pharmacokinetics", "compartment model", "epidemic model", "SIR model", "diagnostic test statistics", "ROC curve", "survival analysis", "Kaplan-Meier", "Cox model", "biomechanics", "Windkessel", "neuron model", "Hodgkin-Huxley", "Goldman-Hodgkin-Katz", "medical imaging physics", "MRI", "ultrasound", "ai999x", "offline", "cpu", "stem", "education", "step-by-step", "latex", "solver"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Intended Audience :: Developers", "Topic :: Scientific/Engineering", "Topic :: Education", "Development Status :: 5 - Production/Stable"]
dependencies = ["sympy>=1.12", "mpmath>=1.3"]

[project.optional-dependencies]
search = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]
plot = ["matplotlib>=3.7"]
all = ["matplotlib>=3.7", "numpy>=1.24", "onnxruntime>=1.17", "tokenizers>=0.15"]
reader = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24"]

[project.scripts]
biomedical-science-ai999x = "biomedical_science_ai999x.cli:main"

[project.urls]
"Source" = "https://github.com/AI999X/biomedical-science-ai999x"
"Issues" = "https://github.com/AI999X/biomedical-science-ai999x/issues"
"Homepage" = "https://ai999x.com"
"Hugging Face" = "https://huggingface.co/AI999X/biomedical-science-ai999x"
"Funding" = "https://buymeacoffee.com/ibnuljaiffarabi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biomedical_science_ai999x = ["pack/*.json", "pack/*/*.json", "pack/*.sqlite", "pack/capabilities/*.py", "pack/search/*.onnx", "pack/reader/*.onnx"]
